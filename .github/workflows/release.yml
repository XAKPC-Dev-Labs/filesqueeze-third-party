# Builds the FileSqueeze FFmpeg payload and publishes the corresponding source.
# Tag push (v*): build and create a GitHub release with every asset.
# Manual run: build only; assets are kept as a workflow artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache source archives
        uses: actions/cache@v4
        with:
          path: ffmpeg/cache
          key: ffmpeg-sources-${{ hashFiles('ffmpeg/sources.lock') }}

      - name: Build FFmpeg
        run: |
          mkdir -p ffmpeg/cache ffmpeg/out
          docker build -t filesqueeze-ffmpeg-build ffmpeg
          docker run --rm -v "$PWD/ffmpeg/cache:/cache" -v "$PWD/ffmpeg/out:/out" filesqueeze-ffmpeg-build

      - name: Archive Magick sources
        # Copies of the upstream revisions in magick/README.md, in case an upstream repository changes.
        run: |
          fetch() { curl -fsSL -o "ffmpeg/out/magick-$1-$3.tar.gz" "https://github.com/$2/archive/$3.tar.gz"; }
          fetch Magick.Native dlemstra/Magick.Native 1187ae6ead3c4ac8b3020cfd8a98b9990697eec6
          fetch Dependencies ImageMagick/Dependencies c97d2ef53d5ee9c25e70e98a27a306b932f12acb
          fetch heif ImageMagick/heif 5def4181577ada890da9b8cb0b913f93f24c715e
          fetch de265 ImageMagick/de265 80e57d4a56dd9bd725e1d937be8060fbffc36ca1
          (cd ffmpeg/out && sha256sum magick-*.tar.gz > magick-sources.sha256)

      - name: Summary
        run: |
          {
            echo '## SHA-256'
            echo '```'
            cat ffmpeg/out/*.sha256
            echo '```'
            echo '## Toolchain'
            echo '```'
            unzip -p ffmpeg/out/*-filesqueeze.zip '*/toolchain.txt'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: filesqueeze-third-party
          path: |
            ffmpeg/out/*.zip
            ffmpeg/out/*.tar
            ffmpeg/out/*.tar.gz
            ffmpeg/out/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Binaries, corresponding source and build recipe for the native components in FileSqueeze.'
            echo 'Built by this workflow from the tagged commit. See README.md.'
            echo
            echo '```'
            cat ffmpeg/out/*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            ffmpeg/out/*.zip ffmpeg/out/*.tar ffmpeg/out/*.tar.gz ffmpeg/out/*.sha256
